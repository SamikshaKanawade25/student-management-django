<!DOCTYPE html>
<html>
<head>
    <title>Student Management System</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f0f2f5; padding-top: 30px; }
        .card-header { background: #2c3e50; color: white; }
        table th { background: #2c3e50; color: white; }
        .btn-sm { margin-right: 4px; }
    </style>
</head>
<body>
<div class="container">
    <div class="card shadow">
        <div class="card-header d-flex justify-content-between align-items-center">
            <h3 class="mb-0">🎓 Student Management System</h3>
            <a href="{% url 'student_add' %}" class="btn btn-success">+ Add New Student</a>
        </div>
        <div class="card-body">

            <!-- Search bar -->
            <form method="get" class="row g-2 mb-4">
                <div class="col-md-10">
                    <input type="text" name="q" class="form-control" placeholder="Search by name, roll no, or class..." value="{{ query|default_if_none:'' }}">
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-primary w-100">Search</button>
                </div>
            </form>

            <table class="table table-striped table-bordered">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Roll No</th>
                        <th>Class</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                {% for student in students %}
                    <tr>
                        <td>{{ student.name }}</td>
                        <td>{{ student.roll_no }}</td>
                        <td>{{ student.student_class }}</td>
                        <td>{{ student.email }}</td>
                        <td>{{ student.phone }}</td>
                        <td>
                            <a href="{% url 'student_edit' student.pk %}" class="btn btn-warning btn-sm">Edit</a>
                            <a href="{% url 'student_delete' student.pk %}" class="btn btn-danger btn-sm">Delete</a>
                        </td>
                    </tr>
                {% empty %}
                    <tr><td colspan="6" class="text-center">No students found.</td></tr>
                {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
